services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: kulla
      POSTGRES_USER: kulla
      POSTGRES_PASSWORD: kulla
    ports: ["5432:5432"]
    volumes: ["kulla-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kulla"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  kulla-db:

